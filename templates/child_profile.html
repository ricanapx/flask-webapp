{% extends "base.html" %}
{% block content %}

<div class="child-card card shadow-sm p-4" style="border-left: 6px solid #ffb6c1;">
    <h2 class="mb-3">👶 Child Profile</h2>

    <p><strong>Name:</strong> {{ child.child_name }}</p>
    <p><strong>Date of Birth:</strong> {{ formatted_child_dob }}</p>
    <p><strong>Age:</strong> {{ child_age }}</p>
    <p><strong>Child's Stage:</strong> {{ child_stage }}</p>
    <p><strong>Gender:</strong> {{ child.child_gender }}</p>

    <div class="actions mt-3">
        <a href="{{ url_for('edit_child') }}" class="btn btn-edit">Edit Child Profile</a>
    </div>
</div>

{% endblock %}
