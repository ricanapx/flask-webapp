{% extends "base.html" %}
{% block content %}
<h1>Feeding Log</h1>

<form method="POST">
    <label>Time</label>
    <input type="time" name="time" required>

    <label>Amount (ml)</label>
    <input type="number" name="amount" required>

    <label>Notes</label>
    <textarea name="notes"></textarea>

    <button type="submit">Add Feeding</button>
</form>

<h2>Feeding History</h2>
<table>
    <tr>
        <th>Time</th>
        <th>Amount</th>
        <th>Notes</th>
    </tr>
    {% for log in logs %}
    <tr>
        <td>{{ log.time }}</td>
        <td>{{ log.amount }} ml</td>
        <td>{{ log.notes }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
