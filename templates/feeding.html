{% extends "base.html" %}
{% block content %}
<h1>Feeding Log</h1>

<form method="POST">
    <label>Time</label>
    <input type="datetime-local" name="time" required>

    <label>Type</label>
    <select name="type" id="feed-type" onchange="toggleAmountFields()" required>
        <option value="Milk">Milk</option>
        <option value="Water">Water</option>
        <option value="Juice">Juice</option>
        <option value="Meal">Meal</option>
        <option value="Snack">Snack</option>
    </select> 
    
    <div id="amount-section">
        <label>Amount</label>
        <input type="number" name="amount" min="0.1" step="0.1">

        <label>Unit</label>
        <select name="unit">
            <option value="ml">ml</option>
            <option value="oz">oz</option>
        </select>
    </div>  

    <label>Notes</label>
    <textarea name="notes"></textarea>

    <button type="submit">Add Feeding</button>
</form>

<h2>Feeding History</h2>
<table>
    <tr>
        <th>Time</th>
        <th>Type</th>
        <th>Amount</th>
        <th>Notes</th>
        <th>Actions</th>
    </tr>

    {% for log in logs %}
    <tr>
        <td>{{ log.time | format_time }}</td>
        <td>{{ log.type }}</td>

        <td>
            {% if log.amount %}
                {{ log.amount }} {{ log.unit }}
            {% else %}
                - 
            {% endif %}
        </td>

        <td>{{ log.notes }}</td>
        <td> 
            <form action="{{ url_for('delete_feeding', id=log['id']) }}" method="post" style="display:inline;">
                <button class="btn btn-danger btn-sm">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

<script>
function toggleAmountFields() {
    const type = document.getElementById("feed-type").value;
    const amountSection = document.getElementById("amount-section");

    if (type === "Meal" || type === "Snack") {
        amountSection.style.display = "none";
    } else {
        amountSection.style.display = "block";
    }
}

// Run on page load (so editing works)
toggleAmountFields();
</script>
{% endblock %}
