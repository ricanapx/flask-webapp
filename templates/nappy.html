{% extends "base.html" %}
{% block content %}
<h1>Nappy Log</h1>

<form method="POST">
    <label>Time</label>
    <input type="time" name="time" required>

    <label>Type</label>
    <select name="type" required>
        <option value="Wet">Wet</option>
        <option value="Dirty">Dirty</option>
    </select>

    <label>Notes</label>
    <textarea name="notes"></textarea>

    <button type="submit">Add Nappy Change</button>
</form>

<h2>Nappy History</h2>
<table>
    <tr>
        <th>Time</th>
        <th>Type</th>
        <th>Notes</th>
    </tr>
    {% for log in logs %}
    <tr>
        <td>{{ log.time }}</td>
        <td>{{ log.nappy_type }}</td>
        <td>{{ log.notes }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
