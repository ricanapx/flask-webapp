{% extends "base.html" %}
{% block content %}
<h1>Nappy Log</h1>

<form method="POST">
    <label>Time</label>
    <input type="datetime-local" name="time" required>

    <label>Type</label>
    <select name="type" required>
        <option value="Wet">Wet</option>
        <option value="Dirty">Dirty</option>
    </select>

    <label for="notes">Notes</label>
    <textarea name="notes" id="notes" placeholder="Add a note..."></textarea>
    
    <button type="submit">Add Nappy Change</button>
</form>

<h2>Nappy History</h2>
<table>
    <tr>
        <th>Time</th>
        <th>Type</th>
        <th>Notes</th>
        <th>Actions</th>
    </tr>
    {% for log in logs %}
    <tr>
        <td>{{ log.time | format_time }}</td>
        <td>{{ log.nappy_type }}</td>
        <td>{{ log.notes }}</td>
        <td>
            <a href="{{ url_for('edit_nappy', id=log._id) }}" class="btn-warning btn-sm">Edit</a>

            <form action="{{ url_for('delete_nappy', id=log._id) }}" method="post" style="display:inline;">
                <button class="btn btn-danger btn-sm">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
