<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Users</title>
</head>
<body>
    <h1>Registered Users</h1>
    <p>This is some sample data.</p>
    <ul>
    {% for user in users %}
        <li>{{ user['name'] }} - {{ user['email'] }}</li>
    {% endfor %}
    </ul>
    
    <img src="{{ url_for('static', filename='images/data.jpg') }}" alt="Data Image" width="300">
    <a href="{{ url_for('home') }}">Go back to Home Page</a>
</body>
</html>
